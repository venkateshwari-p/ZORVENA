name: Extract ZORVENA website ZIP

on:
  push:
    paths:
      - '.github/workflows/extract-zorvena-zip.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract website archive
        run: |
          mkdir -p extracted
          unzip -o zorvena-showcase-free-hosting.zip -d extracted
          find extracted -maxdepth 3 -type f -print
      - name: Commit extracted website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted/
          if ! git diff --cached --quiet; then
            git commit -m "Extract ZORVENA website archive"
            git push
          fi
